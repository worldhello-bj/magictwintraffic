[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "magictwintraffic"
version = "0.1.0"
description = "Traceable SUMO traffic policy experiments and offline Three.js replay"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.1", "pydantic==2.13.4", "numpy==2.3.5", "sumolib==1.28.0", "libsumo==1.28.0", "eclipse-sumo==1.28.0", "pyproj==3.8.0", "pyarrow==23.0.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
