<line x1="410.00" x2="410.00" y1="115" y2="162" stroke="#b3c2ce" stroke-dasharray="4,4"/>
<text x="28" y="136" font-size="12">benchmark: S3, am, demand 1</text>
<circle cx="1010.00" cy="132" r="4" fill="#16324f"/>
<text x="1060" y="136" font-size="12">n=1; no CI</text>
<text x="380" y="190" font-size="11">-1.362e+04</text>
<text x="1000" y="190" font-size="11">2.861e+05</text>
<text x="28" y="217" font-size="16">Completion-rate difference (fraction)</text>
<line x1="1010.00" x2="1010.00" y1="232" y2="279" stroke="#b3c2ce" stroke-dasharray="4,4"/>
<text x="28" y="253" font-size="12">benchmark: S3, am, demand 1</text>
<circle cx="410.00" cy="249" r="4" fill="#16324f"/>
<text x="1060" y="253" font-size="12">n=1; no CI</text>
<text x="380" y="307" font-size="11">-0.03852</text>
<text x="1000" y="307" font-size="11">0.001834</text>
